<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link data-default-icon="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png" rel="icon" sizes="192x192" href="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png" />
    <title>{% block title %}Instagram Reel Downloader{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gradient-primary: linear-gradient(135deg, #8A3AB9, #BC2A8D 45%, #FCCC63);
            --gradient-secondary: linear-gradient(135deg, rgba(138, 58, 185, 0.25), rgba(252, 204, 99, 0.2));
            --surface-glass: rgba(255, 255, 255, 0.75);
            --surface-glass-alt: rgba(255, 255, 255, 0.55);
            --surface-card: rgba(255, 255, 255, 0.95);
            --text-primary: #101828;
            --text-secondary: #475467;
            --text-muted: #667085;
            --border-subtle: rgba(15, 23, 42, 0.08);
            --border-strong: rgba(15, 23, 42, 0.12);
            --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.15);
            --shadow-card: 0 12px 30px rgba(15, 23, 42, 0.12);
            --shadow-hover: 0 22px 55px rgba(15, 23, 42, 0.2);
            --primary-solid: #0095F6;
            --primary-solid-hover: #0284C7;
            --accent-success: #00BF89;
            --accent-warning: #FACC15;
            --accent-info: #6366F1;
            --accent-danger: #EF4444;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --backdrop-blur: blur(32px);
            --header-height: 72px;
        }

        [data-theme="dark"] {
            --surface-glass: rgba(15, 15, 20, 0.7);
            --surface-glass-alt: rgba(15, 15, 20, 0.55);
            --surface-card: rgba(15, 15, 25, 0.85);
            --text-primary: #F3F4F6;
            --text-secondary: #CBD5F5;
            --text-muted: #9CA3AF;
            --border-subtle: rgba(148, 163, 184, 0.12);
            --border-strong: rgba(148, 163, 184, 0.2);
            --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.45);
            --shadow-card: 0 14px 36px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            background: radial-gradient(circle at 15% 15%, rgba(138, 58, 185, 0.16), transparent 45%),
                        radial-gradient(circle at 80% 0%, rgba(188, 42, 141, 0.18), transparent 55%),
                        linear-gradient(180deg, #F8FAFC 0%, #EFF6FF 35%, #F8FAFC 68%, #F1F5F9 100%);
            position: relative;
            overflow-x: hidden;
            transition: background 0.6s ease, color 0.4s ease;
        }

        [data-theme="dark"] body {
            background: radial-gradient(circle at 15% 15%, rgba(138, 58, 185, 0.22), transparent 45%),
                        radial-gradient(circle at 80% 0%, rgba(2, 132, 199, 0.2), transparent 55%),
                        linear-gradient(180deg, #0F172A 0%, #111827 35%, #0B1120 68%, #020817 100%);
        }

        .page-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .page-shell::before,
        .page-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .page-shell::before {
            background: radial-gradient(600px circle at 10% 20%, rgba(138, 58, 185, 0.18), transparent 40%),
                        radial-gradient(500px circle at 90% 10%, rgba(99, 102, 241, 0.16), transparent 50%),
                        radial-gradient(650px circle at 90% 80%, rgba(236, 72, 153, 0.12), transparent 45%);
            opacity: 0.85;
        }

        .page-shell::after {
            background-image: url('data:image/svg+xml,%3Csvg width="160" height="160" xmlns="http://www.w3.org/2000/svg" fill="none"%3E%3Cg opacity="0.12" stroke="%23FFFFFF" stroke-width="0.7"%3E%3Crect x="-1" y="-1" width="80" height="80"/%3E%3Crect x="79" y="79" width="80" height="80"/%3E%3C/g%3E%3C/svg%3E');
            mix-blend-mode: soft-light;
            opacity: 0.35;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem clamp(1.5rem, 3vw, 3.75rem);
            position: sticky;
            top: 0;
            z-index: 15;
            backdrop-filter: blur(24px);
            background: color-mix(in srgb, var(--surface-glass) 78%, transparent);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--text-primary);
        }

        .brand-badge {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--gradient-primary);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 12px 28px rgba(138, 58, 185, 0.35);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .pill,
        .pill-link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .pill-primary {
            background: color-mix(in srgb, var(--primary-solid) 84%, transparent);
            color: #fff;
            box-shadow: 0 10px 25px rgba(0, 149, 246, 0.25);
        }

        .pill-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 32px rgba(0, 149, 246, 0.32);
            border-color: rgba(2, 132, 199, 0.4);
        }

        .theme-toggle-button {
            border: 1px solid var(--border-subtle);
            background: color-mix(in srgb, var(--surface-glass) 92%, transparent);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        .theme-toggle-button:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
            border-color: var(--border-strong);
        }

        .theme-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-primary);
            stroke-width: 1.6;
        }

        main.site-main {
            flex: 1;
            width: min(1200px, calc(100% - clamp(2rem, 6vw, 5.5rem)));
            margin: clamp(1.5rem, 4vw, 4.5rem) auto clamp(1.5rem, 4vw, 4rem);
            display: grid;
            gap: clamp(1.5rem, 3vw, 2.75rem);
            position: relative;
        }

        footer.site-footer {
            padding: 2rem clamp(1.5rem, 3vw, 3.75rem) 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        footer.site-footer span.heart {
            color: var(--accent-danger);
            display: inline-block;
            transform-origin: center;
            animation: heartbeat 1.8s ease infinite;
        }

        .frosted-panel {
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            background: var(--surface-glass);
            backdrop-filter: var(--backdrop-blur);
            padding: clamp(2.25rem, 4vw, 3rem);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .frosted-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid transparent;
            background: radial-gradient(circle at top, rgba(255, 255, 255, 0.22), transparent 65%);
            mix-blend-mode: soft-light;
            opacity: 0.85;
            z-index: -1;
        }

        .floating-shape {
            position: absolute;
            width: clamp(120px, 22vw, 240px);
            aspect-ratio: 1;
            border-radius: 999px;
            background: var(--gradient-secondary);
            filter: blur(0);
            opacity: 0.48;
            transform: translate3d(0, 0, 0);
            animation: float 18s ease-in-out infinite;
        }

        .floating-shape:nth-of-type(1) {
            top: -18%;
            right: -12%;
            animation-delay: -6s;
        }

        .floating-shape:nth-of-type(2) {
            bottom: -22%;
            left: -18%;
            animation-delay: -2s;
        }

        h1, h2, h3, h4, h5 {
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        h1.hero-title {
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: clamp(0.85rem, 3vw, 1.4rem);
        }

        .gradient-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .lead {
            font-size: clamp(1rem, 1.8vw, 1.15rem);
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 54ch;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem 0.9rem;
            font-size: 0.8rem;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            background: color-mix(in srgb, var(--surface-glass) 72%, transparent);
            color: var(--text-muted);
            font-weight: 500;
        }

        .badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--accent-success);
            box-shadow: 0 0 0 4px rgba(0, 191, 137, 0.2);
        }

        .section-title {
            font-size: clamp(1.1rem, 1.9vw, 1.45rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.75rem;
        }

        .muted {
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            gap: clamp(1rem, 2.2vw, 1.5rem);
        }

        .grid.two-col {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        }

        .chip {
            border-radius: 999px;
            padding: 0.45rem 0.9rem;
            background: color-mix(in srgb, var(--surface-glass-alt) 70%, transparent);
            border: 1px solid var(--border-subtle);
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chip .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: currentColor;
            opacity: 0.75;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .callout {
            border-radius: var(--radius-md);
            padding: 1rem 1.2rem;
            border: 1px solid var(--border-subtle);
            background: color-mix(in srgb, var(--surface-card) 92%, transparent);
            display: flex;
            gap: 0.8rem;
            align-items: flex-start;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .callout strong {
            color: var(--text-primary);
        }

        .callout-icon {
            font-size: 1.15rem;
            line-height: 1;
        }

        .alert {
            border-radius: var(--radius-md);
            padding: 1rem 1.2rem;
            border: 1px solid rgba(239, 68, 68, 0.25);
            background: rgba(239, 68, 68, 0.12);
            color: #B91C1C;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .alert::before {
            content: "!";
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.16);
            color: inherit;
            font-weight: 600;
        }

        button,
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            border-radius: 14px;
            border: 1px solid transparent;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.85rem 1.2rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: 0 16px 32px rgba(138, 58, 185, 0.28);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 42px rgba(138, 58, 185, 0.32);
        }

        .btn-outline {
            background: transparent;
            border-color: var(--border-subtle);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .btn-ghost {
            background: color-mix(in srgb, var(--surface-glass) 60%, transparent);
            border-color: var(--border-subtle);
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            transform: translateY(-1px);
            border-color: var(--border-strong);
        }

        .btn:disabled,
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .icon {
            width: 1.05rem;
            height: 1.05rem;
        }

        .divider {
            height: 1px;
            background: var(--border-subtle);
            width: 100%;
            margin: 1.5rem 0;
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        .metric-card {
            border-radius: var(--radius-md);
            padding: 1rem 1.2rem;
            background: color-mix(in srgb, var(--surface-glass-alt) 75%, transparent);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
            display: grid;
            gap: 0.55rem;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .metric-change {
            font-size: 0.75rem;
            color: var(--accent-success);
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .video-preview {
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            background: #000;
            position: relative;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.22);
        }

        .video-preview video {
            width: 100%;
            display: block;
            background: #000;
        }

        .video-preview .badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
        }

        .faq {
            display: grid;
            gap: 0.75rem;
        }

        .faq-item {
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            background: color-mix(in srgb, var(--surface-card) 90%, transparent);
            padding: 1.2rem 1.4rem;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .faq-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 32px rgba(15, 23, 42, 0.15);
        }

        .faq-item h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .faq-item p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.55;
        }

        .muted-link {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.4);
        }

        .muted-link:hover {
            border-bottom-style: solid;
        }

        @media (max-width: 900px) {
            .top-nav {
                padding-inline: clamp(1.25rem, 5vw, 2rem);
                position: static;
                background: transparent;
                border-bottom: none;
            }

            .nav-actions {
                gap: 0.5rem;
            }

            .pill {
                display: none;
            }

            main.site-main {
                width: min(100%, calc(100% - 2.5rem));
                margin-top: clamp(2rem, 10vw, 3rem);
            }

            .frosted-panel {
                padding: clamp(1.8rem, 6vw, 2.5rem);
            }
        }

        @media (max-width: 640px) {
            body {
                background: linear-gradient(180deg, rgba(138, 58, 185, 0.12) 0%, rgba(15, 23, 42, 0.05) 55%, rgba(2, 132, 199, 0.08) 100%), #0F172A;
            }

            [data-theme="dark"] body {
                background: linear-gradient(180deg, rgba(138, 58, 185, 0.22) 0%, rgba(15, 23, 42, 0.52) 55%, rgba(2, 132, 199, 0.32) 100%);
            }

            .top-nav {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
                padding-block: 1rem 0;
            }

            .brand {
                font-size: 1.05rem;
            }

            .brand-badge {
                width: 38px;
                height: 38px;
                font-size: 0.95rem;
            }

            .frosted-panel {
                border-radius: 20px;
            }

            .badge {
                font-size: 0.75rem;
            }

            footer.site-footer {
                font-size: 0.85rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            18% {
                transform: scale(1.18);
            }
            36% {
                transform: scale(1);
            }
            54% {
                transform: scale(1.15);
            }
            72% {
                transform: scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(1);
                opacity: 0.48;
            }
            50% {
                transform: translate3d(6%, -6%, 0) scale(1.05);
                opacity: 0.58;
            }
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="page-shell" id="page">
        <header class="top-nav">
            <div class="brand">
                <div class="brand-badge">IG</div>
                <span>Reel Downloader</span>
            </div>
            <div class="nav-actions">
                <a class="pill pill-link" href="https://instaloader.github.io" target="_blank" rel="noopener">Powered by Instaloader</a>
                <button class="theme-toggle-button" id="themeToggle" aria-label="Toggle theme">
                    <svg class="theme-icon" id="lightIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5" />
                        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m11.32 11.32l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42m11.32-11.32l1.42-1.42" />
                    </svg>
                    <svg class="theme-icon" id="darkIcon" style="display: none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 0 1 11.21 3 7 7 0 1 0 21 12.79z" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="site-main">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <p>For personal use only - Made with <span class="heart">&#10084;</span> by Hiba</p>
        </footer>
    </div>

    <script>
        const htmlElement = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const lightIcon = document.getElementById('lightIcon');
        const darkIcon = document.getElementById('darkIcon');

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        } else {
            const prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const themeToSet = prefersDarkMode ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', themeToSet);
            updateThemeIcon(themeToSet);
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            if (!lightIcon || !darkIcon) return;
            if (theme === 'dark') {
                lightIcon.style.display = 'none';
                darkIcon.style.display = 'block';
            } else {
                lightIcon.style.display = 'block';
                darkIcon.style.display = 'none';
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
