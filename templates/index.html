{% extends "base.html" %}

{% block title %}Reel Downloader{% endblock %}

{% block extra_styles %}
<style>
    .hero-layout {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
        align-items: stretch;
    }

    .form-card {
        display: grid;
        gap: clamp(1.5rem, 4vw, 2rem);
        position: relative;
    }

    .form-card header {
        display: grid;
        gap: 1rem;
        position: relative;
    }

    .download-form {
        display: grid;
        gap: 1rem;
        position: relative;
        z-index: 2;
    }

    .input-layout {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
    }

    .input-wrapper {
        flex: 1 1 240px;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        border-radius: 16px;
        border: 1px solid var(--border-subtle);
        padding: 0.2rem 0.85rem 0.2rem 1rem;
        background: color-mix(in srgb, var(--surface-card) 90%, transparent);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .input-wrapper:focus-within {
        border-color: rgba(0, 149, 246, 0.35);
        box-shadow: 0 0 0 3px rgba(0, 149, 246, 0.15);
    }

    .input-wrapper .input-icon {
        width: 20px;
        height: 20px;
        color: var(--text-muted);
        flex: 0 0 auto;
        display: grid;
        place-items: center;
    }

    .input-field {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text-primary);
        font-size: 1rem;
        font-weight: 500;
        padding-block: 0.85rem;
    }

    .input-field::placeholder {
        color: var(--text-muted);
        opacity: 0.85;
    }

    .input-field:focus {
        outline: none;
    }

    #submitBtn {
        flex: 0 0 auto;
        padding-inline: 1.5rem;
        min-width: 180px;
        position: relative;
        height: 44px;
    }

    #submitBtn .btn-spinner {
        display: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        animation: spin 0.85s linear infinite;
    }

    #submitBtn.is-loading .btn-spinner {
        display: inline-flex;
    }

    #submitBtn.is-loading #submitLabel {
        opacity: 0.6;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (max-width: 640px) {
        #submitBtn {
            width: 100%;
            min-width: auto;
        }

        .input-layout {
            flex-direction: column;
            align-items: stretch;
            gap: 0.75rem;
        }

        .input-wrapper {
            padding-inline: 1rem;
            flex: 1 1 auto;
        }
    }

    @media (max-width: 480px) {
        .input-wrapper {
            padding: 0.2rem 0.75rem 0.2rem 0.85rem;
        }

        .input-field {
            font-size: 0.95rem;
        }

        #submitBtn {
            padding: 0.85rem 1.1rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="grid hero-layout">
    <article class="frosted-panel form-card">
        <span class="floating-shape"></span>
        <span class="floating-shape"></span>
        <header>
            <h1 class="hero-title">Save <span class="gradient-text">Instagram Reels</span></h1>
            <p class="lead">Paste a public Reel link and download instantly</p>
        </header>

        <form id="downloadForm" class="download-form" method="post">
            <div class="input-layout">
                <label class="sr-only" for="urlInput">Instagram Reel URL</label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">&#128279;</span>
                    <input type="url" class="input-field" id="urlInput" name="url" placeholder="instagram.com/reel/..." required autocomplete="off" spellcheck="false">
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span class="btn-spinner" aria-hidden="true"></span>
                    <span id="submitLabel">Download</span>
                </button>
            </div>

            {% if error %}
            <div class="alert" role="alert">{{ error }}</div>
            {% endif %}
        </form>
    </article>
</section>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('downloadForm');
    const submitBtn = document.getElementById('submitBtn');
    const urlInput = document.getElementById('urlInput');

    if (form) {
        form.addEventListener('submit', () => {
            if (!submitBtn) return;
            submitBtn.classList.add('is-loading');
            submitBtn.disabled = true;
        });
    }

    // Handle shared URL from PWA Share Target
    {% if shared_url %}
    (function() {
        const sharedUrl = "{{ shared_url }}";
        const backgroundMode = {{ 'true' if background_mode else 'false' }};

        // Always set shared_url in session data for client
        window.__SHARE__ = { url: sharedUrl, background: backgroundMode };

        // Fill the form immediately with the shared URL
        if (urlInput) {
            urlInput.value = sharedUrl;
        }

        if (backgroundMode) {
            // Background mode: show small badge and auto-submit
            showBackgroundBadge(sharedUrl);
            setTimeout(() => {
                if (form) form.submit();
            }, 1400);
        } else {
            // Normal mode: show bottom sheet
            showBottomSheet(sharedUrl);
            setTimeout(() => {
                if (form) form.submit();
            }, 2800);
        }
    })();
    {% endif %}

    function showBackgroundBadge(url) {
        const badge = document.createElement('div');
        badge.className = 'pwa-share-badge';
        badge.setAttribute('role', 'status');
        badge.setAttribute('aria-live', 'polite');
        badge.innerHTML = '📥 Downloading Reel… <small style="opacity: 0.75">processing</small>';
        document.body.appendChild(badge);

        setTimeout(() => badge.classList.add('show'), 50);
        setTimeout(() => {
            badge.classList.remove('show');
            setTimeout(() => badge.remove(), 200);
        }, 1400);
    }

    function showBottomSheet(url) {
        const backdrop = document.createElement('div');
        backdrop.className = 'pwa-backdrop';
        
        const sheet = document.createElement('div');
        sheet.className = 'pwa-bottom-sheet';
        sheet.setAttribute('role', 'dialog');
        sheet.setAttribute('aria-modal', 'true');
        sheet.setAttribute('aria-labelledby', 'sheet-title');
        
        sheet.innerHTML = `
            <h2 id="sheet-title" style="font-size: 1.1rem; font-weight: 600; margin: 0 0 0.75rem; color: var(--text-primary);">Ready to Download</h2>
            <div style="padding: 0.85rem; background: var(--surface-glass-alt); border: 1px solid var(--border-subtle); border-radius: 12px; font-size: 0.88rem; color: var(--text-secondary); word-break: break-all; margin-bottom: 1rem;">${url}</div>
            <button class="btn btn-primary" style="width: 100%; height: 44px; border-radius: 8px; margin-bottom: 0.75rem;" onclick="document.getElementById('downloadForm').submit();">Download Now</button>
            <button class="btn btn-outline" style="width: 100%; height: 44px; border-radius: 8px;" onclick="this.closest('.pwa-backdrop').remove(); this.closest('.pwa-bottom-sheet').remove();">Cancel</button>
        `;

        document.body.appendChild(backdrop);
        document.body.appendChild(sheet);
        document.body.style.overflow = 'hidden';

        setTimeout(() => {
            backdrop.classList.add('show');
            sheet.classList.add('show');
        }, 50);

        backdrop.onclick = () => {
            backdrop.classList.remove('show');
            sheet.classList.remove('show');
            document.body.style.overflow = '';
            setTimeout(() => {
                backdrop.remove();
                sheet.remove();
            }, 300);
        };
    }
</script>
{% endblock %}
